<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ad Studio · Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='studio.css') }}"><link rel="stylesheet" href="/brand.css">
</head>
<body>
<main class="center-page">
  <form class="panel" method="post" action="/login">
    <img src="/brand/logo.png" alt="{{ BRAND.name }}">
    <h1>Ad Studio</h1>
    <p>Enter the team password.</p>
    <input class="f" type="password" id="password" name="password" autocomplete="current-password" autofocus required aria-label="Password">
    <input type="hidden" name="next" value="{{ next }}">
    {% if error %}<p class="err">{{ error }}</p>{% endif %}
    <button class="btn btn-p" type="submit">Sign in</button>
  </form>
</main>
</body>
</html>
