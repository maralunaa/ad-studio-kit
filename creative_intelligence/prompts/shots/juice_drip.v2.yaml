version: 2
name: juice_drip
label: Juice dripping (sensory)
summary: A halved fruit held up, juice gathering and dripping off it in slow motion.
use: Sensory beats; appetite
duration_s: 5
energy: low
retired: true
product_types:
- fruit
styles:
- sensory
cast: true
route: veo
audio: none
strict_qa: true
qa_note: >-
  The juice must look like real fruit juice: thin, clear, watery beads or a thin wet sheen. Juice that looks like
  gel, jelly, slime, syrup or a glossy blob sliding off the flesh is a fail on fruit accuracy and realism
  (feedback 2026-11-11, Honey Mango: a gel blob on the cubes).
still:
  locks: One half of the fruit exactly as in the reference photos, cut face down-angled towards the camera, held
    between fingertips; the flesh glistening, true colour; thin clear beads of juice, never a gel.
  freedom: Background colour and blur.
  composition: Close, the half in the upper middle of the frame, empty space below for the drops.
  lighting: Hard backlight that makes every drop sparkle.
motion:
  camera: the camera holds still
  change: juice gathers on the edge of the flesh and drips down in slow motion, two or three small, thin, clear, watery drops
params:
- name: drops
  value: two or three
  feel: a stream of juice looks like a tap and stops reading as fruit
pitfalls:
- the juice is a thick glossy gel or blob that slides off the flesh (v2, 2026-11-11)
- juice turns into jelly, foam or syrup
- the flesh melts
negative: gel, jelly, slime, glob, blob, syrup, extra fruit, extra fingers, melting, foam, text, logos, watermarks, captions
# Retired 2026-11-11: "the juice clips are always some syrup being put on top of the fruit and doesn't look like
#   fruit juice" (Honey Mango, Blood Orange); no script or library fill uses it until a method looks real.
