version: 2
name: hand_tear
label: Hands pull it apart (sensory)
summary: Two hands pull the ripe fruit apart, showing the wet flesh inside.
use: Sensory openers and payoffs; the most visceral beat
duration_s: 5
energy: high
product_types:
- fruit
styles:
- sensory
cast: true
route: veo
audio: none
strict_qa: false
count_check: false
qa_note: >-
  Two hands pull one fruit into two halves: that change is the point of the shot, so judge that it is the same fruit
  (skin, flesh colour, seeds) before and after, not that the count stays the same. The inside must match the real
  cut photos.
still:
  locks: One ripe fruit exactly as in the reference photos, already cut most of the way through so the halves can be
    pulled apart, held in two hands over a plain surface; skin colour and markings true.
  freedom: Surface, background blur, hand position.
  composition: Extreme close-up, the fruit and fingertips filling the middle of the frame.
  lighting: Hard side light that makes the flesh glisten.
motion:
  camera: the camera holds still, very close
  change: the hands slowly pull the two halves apart, the flesh stretching and glistening as it opens to show the inside
params:
- name: pace
  value: slow, about two seconds to open
  feel: a fast pull reads as violent and blurs the flesh
pitfalls:
- the inside does not match the real flesh colour or seeds
- extra fingers or hands merging with the fruit
- the fruit splits into more than two pieces
negative: extra fruit, extra hands, extra fingers, melting, gore, knife, text, logos, watermarks, captions
# v2 (2026-10-26): normal QA bar; hands in motion failed the strict warping minimum at 3.93 overall.
