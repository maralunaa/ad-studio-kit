version: 3
name: packing
label: Packing
summary: Our ${brand_packaging}, packed with the fruit in tissue, the camera slowly moving in.
use: Care and shipping beat
duration_s: 5
energy: medium
product_types:
- fruit
route: kling
audio: none
from_images: []
strict_qa: true
still:
  locks: Our plain white shipping box with tissue paper; fruit exactly as in the reference photos; at most three
    fruits.
  freedom: Table surface, packing area props.
  composition: Top-down three-quarter view, box in the lower two-thirds.
  lighting: Clean, bright daylight.
motion:
  camera: the camera holds still
  change: the box is complete and rigid from the first frame (walls, flaps and lid never build up, unfold or change shape); nothing in the box moves; the camera slowly pushes in over the packed box, and the tissue rustles a
    little at the edges
params:
- name: fruit in box
  value: 2 to 3, already in place
  feel: a hand placing fruit made it duplicate and morph (v1 QA found the count going 2 to 1 and a half doubled)
pitfalls:
- fruit multiply in the box
- 'box print invented: the box is plain white'
negative: box assembling itself, box building up, changing box shape, extra fruit, merging or splitting fruit, melting, warped hands, extra fingers, text, logos, watermarks,
  captions
