version: 6
name: knife_cut
label: Knife cut
summary: A knife slices cleanly through the fruit.
use: Reveal beat; the turn from outside to inside. Needs an approved cross-section image to end on, so the inside
  is the real fruit
duration_s: 5
energy: high
product_types:
- fruit
route: kling
audio: none
from_images:
- kitchen_prep
strict_qa: true
count_check: false
qa_note: >-
  The knife cuts one whole fruit into two halves: that change is the point of the shot, so judge that it is the same fruit (skin, colour, shape) before and after the cut, not that the count stays the same.
still:
  locks: One whole fruit exactly as in the reference photos on a wooden board; a chef's knife lying flat on the
    board beside it, handle towards the camera; no hands in the still.
  freedom: Board, kitchen background.
  composition: Close, three-quarter view, board in the lower two-thirds.
  lighting: Bright kitchen window light.
motion:
  camera: the camera holds still
  change: one hand picks up the knife and slices down through the fruit in one clean stroke, and the half falls open to show the flesh
params:
- name: cut
  value: one clean stroke
  feel: sawing motion looks fake
pitfalls:
- the inside does not match the real flesh colour or stone
- the knife bends
- the fruit regrows after the cut
- 'v1: a knife held by a hand in the still made the image model return nothing (safety filter); the still shows
  the knife resting, the cut happens in the motion'
- 'v2: with no real cut photo to aim for, Kling invented an avocado-like inside; v3 ends on an approved cut_reveal
  image (end frame)'
- 'v3: cut_reveal was both a start and an end source, so the knife ''cut'' an already cut fruit; v4 starts from
  a whole fruit (kitchen_prep or a card still) and ends on the cut photo'
- 'v4: the end photo came from another shoot, and a start and end that differ make Kling switch shots (its guide):
  split panels and a second knife. v5 ends on an edit of the start still, cut open with the inside of the cut photo'
negative: extra fruit, merging or splitting fruit, melting, warped hands, extra fingers, text, logos, watermarks,
  captions
end_from_images:
- cut_reveal
end_edit: true
# v6 (2026-10-26): every take failed 'Same fruit first to last' because QA forces it to 1 when the fruit count changes, and this shot changes it on purpose (comparison takes 34-36, 43-45, 65-68).
